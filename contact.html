  <style>
    /* ── Contact page-specific styles ── */
    .contact-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--bar) + 5rem) 2rem calc(var(--bar) + env(safe-area-inset-bottom) + 4rem);
      min-height: 100dvh;
    }
 
    .contact-wrap {
      max-width: 520px;
      width: 100%;
    }
 
    .contact-heading {
      font-size: clamp(3rem, 7vw, 4.5rem);
      margin-top: 0.75rem;
      margin-bottom: 1.25rem;
    }
 
    .contact-tagline {
      font-size: 1.05rem;
      color: var(--text-2);
      line-height: 1.7;
      max-width: 38ch;
      margin-bottom: 2.75rem;
    }
 
    /* Email block */
    .email-block {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-xl);
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }
    .email-block:hover { border-color: rgba(5,103,130,0.5); }
 
    .email-text { flex: 1; min-width: 0; }
    .email-label {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 0.2rem;
    }
    .email-address {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
 
    .copy-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      height: 2rem;
      padding: 0 0.875rem;
      border-radius: 9999px;
      border: 1px solid var(--line-strong);
      background: rgba(5,103,130,0.18);
      color: rgba(255,255,255,0.75);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover {
      background: rgba(5,103,130,0.45);
      border-color: rgba(255,255,255,0.35);
      color: #fff;
    }
    .copy-btn:active { transform: scale(0.95); }
    .copy-btn.copied {
      background: rgba(34,197,94,0.18);
      border-color: rgba(34,197,94,0.45);
      color: #4ade80;
    }
    [data-theme="light"] .copy-btn {
      background: rgba(255,255,255,0.55);
      border-color: rgba(5,103,130,0.25);
      color: rgba(13,36,40,0.8);
    }
    [data-theme="light"] .copy-btn:hover {
      background: rgba(255,255,255,0.85);
      border-color: rgba(5,103,130,0.5);
      color: #0d2428;
    }
    [data-theme="light"] .copy-btn.copied {
      background: rgba(34,197,94,0.1);
      border-color: rgba(34,197,94,0.4);
      color: #16a34a;
    }
 
    .contact-note {
      margin-top: 2rem;
      font-size: 0.82rem;
      color: var(--text-3);
      font-style: italic;
    }
 
    /* Fade-up animation */
    .fade-up {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    .fade-up:nth-child(1) { transition-delay: 0.05s; }
    .fade-up:nth-child(2) { transition-delay: 0.12s; }
    .fade-up:nth-child(3) { transition-delay: 0.19s; }
    .fade-up:nth-child(4) { transition-delay: 0.26s; }
    .fade-up:nth-child(5) { transition-delay: 0.33s; }
    .fade-up:nth-child(6) { transition-delay: 0.4s; }
 
    @media (max-width: 540px) {
      .contact-main { padding: calc(var(--bar) + 3.5rem) 1.25rem calc(var(--bar) + env(safe-area-inset-bottom) + 3rem); }
    }

  <script>
    /* ── Email obfuscation + copy ──
       ROT13-encoded parts, assembled at runtime. Crawlers get nothing useful.
       To encode your own address: https://rot13.com
       Replace the three _r values below with ROT13 of each part of your email.
       Example: 'dave.smith' → 'qnir.fzvgu', 'gmail' → 'tznvy', 'com' → 'pbz'        */
    const _rot = s => s.replace(/[a-zA-Z]/g, c =>
      String.fromCharCode(c.charCodeAt(0) + (c.toLowerCase() < 'n' ? 13 : -13)));
    const _u = 'puxbhgfnxvf'; 
    const _d = 'tznvy';      
    const _t = 'pbz';        
    const email = `${_rot(_u)}@${_rot(_d)}.${_rot(_t)}`;
    document.getElementById('email-display').textContent = email;
 
    const copyBtn   = document.getElementById('copy-btn');
    const copyLabel = document.getElementById('copy-label');
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(email);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = email; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      copyBtn.classList.add('copied');
      copyLabel.textContent = 'Copied!';
      setTimeout(() => { copyBtn.classList.remove('copied'); copyLabel.textContent = 'Copy'; }, 2000);
    });
 
    /* ── Fade-up observer ── */
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  </script>
